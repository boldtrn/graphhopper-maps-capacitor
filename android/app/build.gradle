import com.android.build.OutputFile

apply plugin: 'com.android.application'

android {

    namespace = 'com.graphhopper.maps'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.graphhopper.maps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "3.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Universal large APK bundle (~50MB) for debug only (used via `npx cap run android`)
    // For release split into one APK per ABI
    // and remove support for x86/x86_64 (emulator/Chromebook only) => ~20-24MB apk.
    // Reason: the MapLibre GL Native renderer ships a ~10 MB .so library per CPU architecture.
    def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

    // F-Droid builds one ABI per versionCode and passes -Pabi=<single abi> (see metadata/com.graphhopper.maps.yml)
    // If none is specified all apks will be built.
    def fdroidAbi = project.findProperty('abi')
    splits {
        abi {
            enable isReleaseBuild
            reset()
            if (fdroidAbi) {
                include fdroidAbi
            } else {
                include 'arm64-v8a', 'armeabi-v7a'
            }
            universalApk false
        }
    }

    // Each split APK needs a distinct, monotonically-increasing versionCode so the
    // store (F-Droid / direct) treats them as separate artifacts. Scheme: base*10 + abi,
    // with arm64 > armeabi-v7a so a 64-bit-capable device prefers the arm64 build.
    // F-Droid's metadata must mirror this exactly via:
    //   VercodeOperation: ["%c * 10 + 1", "%c * 10 + 2"]
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiOffset = ['armeabi-v7a': 1, 'arm64-v8a': 2].get(output.getFilter(OutputFile.ABI))
            if (abiOffset != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiOffset
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-maplibre-navigation')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
