import com.android.build.api.artifact.ScopedArtifact
import com.android.build.api.variant.ScopedArtifacts
import org.gradle.api.DefaultTask
import org.gradle.api.file.Directory
import org.gradle.api.file.RegularFile
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.TaskAction

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

apply plugin: 'com.android.application'

// Strip GoogleLocationEngine* classes (GMS refs) from merged classes before dexing so
// F-Droid's scanner accepts the APK. Remove when maplibre-navigation-android drops
// GoogleLocationEngine (cf. maplibre/maplibre-native#379 — same FLOSS change in MapLibre Native 10).
abstract class StripGoogleLocationEngineTask extends DefaultTask {
    @InputFiles abstract ListProperty<RegularFile> getAllJars()
    @InputFiles abstract ListProperty<Directory> getAllDirectories()
    @OutputFile abstract RegularFileProperty getOutput()

    private static final String PREFIX = 'org/maplibre/navigation/core/location/engine/GoogleLocationEngine'

    @TaskAction
    void run() {
        def out = output.get().asFile
        out.parentFile.mkdirs()
        def seen = new HashSet<String>()
        new ZipOutputStream(new FileOutputStream(out)).withCloseable { zos ->
            allJars.get().each { jar ->
                new ZipFile(jar.asFile).withCloseable { zip ->
                    for (def es = zip.entries(); es.hasMoreElements(); ) {
                        def e = es.nextElement()
                        if (e.directory || e.name.startsWith(PREFIX) || !seen.add(e.name)) continue
                        zos.putNextEntry(new ZipEntry(e.name))
                        zip.getInputStream(e).withCloseable { it.transferTo(zos) }
                        zos.closeEntry()
                    }
                }
            }
            allDirectories.get().each { dir ->
                def root = dir.asFile.toPath()
                dir.asFile.eachFileRecurse { f ->
                    if (!f.isFile()) return
                    def name = root.relativize(f.toPath()).toString().replace('\\', '/')
                    if (name.startsWith(PREFIX) || !seen.add(name)) return
                    zos.putNextEntry(new ZipEntry(name))
                    f.withInputStream { it.transferTo(zos) }
                    zos.closeEntry()
                }
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def t = tasks.register("strip${variant.name.capitalize()}GoogleLocationEngine", StripGoogleLocationEngineTask)
        variant.artifacts.forScope(ScopedArtifacts.Scope.ALL)
            .use(t)
            .toTransform(ScopedArtifact.CLASSES.INSTANCE, { it.allJars }, { it.allDirectories }, { it.output })
    }
}

android {

    namespace = 'com.graphhopper.maps'
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.graphhopper.maps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 27
        versionName "3.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-maplibre-navigation')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
