ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.8.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.graphhopper.navigationplugin'
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Capacitor
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // From 13.0 'android-sdk' renders with Vulkan; stick to OpenGL ES (same classes, different renderer)
    implementation 'org.maplibre.gl:android-sdk-opengl:13.6.0'

    // Navigation SDK (KMP version). From 5.0.0-pre14 the geometry stack is Spatial-K
    // (org.maplibre.spatialk.*), a different package than the renderer's geojson/turf,
    // Both modules depend on the Vulkan 'android-sdk', which would clash with the OpenGL variant above.
    implementation('org.maplibre.navigation:navigation-core:5.0.0') {
        exclude group: 'org.maplibre.gl', module: 'android-sdk'
    }
    implementation('org.maplibre.navigation:navigation-ui-android:5.0.0') {
        exclude group: 'org.maplibre.gl', module: 'android-sdk'
    }

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
